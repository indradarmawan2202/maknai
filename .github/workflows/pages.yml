name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      # Pratinjau branch `live` di /live/ (untuk uji Maknai Live tanpa mengubah situs utama)
      - uses: actions/checkout@v4
        with:
          ref: live
          path: site/live
        continue-on-error: true
      - run: rm -rf site/.git site/live/.git site/live/.github site/live/supabase
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
